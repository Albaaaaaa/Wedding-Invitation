      (function () {
        try {
          var patchFetch = function (target) {
            if (!target) return;
            var desc = Object.getOwnPropertyDescriptor(target, 'fetch');
            if (desc && desc.configurable && !desc.writable && !desc.set) {
              var currentFetch = desc.get ? desc.get.call(window) : window.fetch;
              Object.defineProperty(target, 'fetch', {
                configurable: true,
                enumerable: desc.enumerable !== false,
                get: function () {
                  return currentFetch;
                },
                set: function (fn) {
                  if (typeof fn === 'function') {
                    currentFetch = fn;
                  }
                },
              });
            }
          };
          patchFetch(window);
          if (typeof Window !== 'undefined' && Window.prototype) {
            patchFetch(Window.prototype);
          }
        } catch (_e) {}

        window.addEventListener(
          'error',
          function (event) {
            var msg = String((event && event.message) || '');
            var src = String((event && event.filename) || '');
            if (
              src.indexOf('chrome-extension://') === 0 ||
              msg.indexOf('Cannot set property fetch') !== -1
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );

        window.addEventListener(
          'unhandledrejection',
          function (event) {
            var reason = event && event.reason;
            var msg = String((reason && (reason.message || reason.stack || reason)) || '');
            if (
              msg.indexOf('chrome-extension://') !== -1 ||
              msg.indexOf('Cannot set property fetch') !== -1
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );
      })();
    </script>
