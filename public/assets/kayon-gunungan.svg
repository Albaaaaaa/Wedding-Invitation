    <circle cx="256" cy="160" r="3.5" />
    <circle cx="256" cy="244" r="3.5" />
    <circle cx="256" cy="334" r="4" />
    <circle cx="256" cy="416" r="4.5" />
    <circle cx="202" cy="282" r="3" />
    <circle cx="310" cy="282" r="3" />
