    <path d="M234 600 L234 544 C234 530 278 530 278 544 L278 600 Z" fill="#EADFCB" fill-opacity="0.22" />
    <!-- Garuda Wings Flanking the Gate -->
    <path d="M206 548 C166 536 142 504 148 472 C164 484 186 502 206 522 Z" />
    <path d="M306 548 C346 536 370 504 364 472 C348 484 326 502 306 522 Z" />
