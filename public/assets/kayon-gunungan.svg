    <path d="M256 205 C230 192 212 168 214 142 C216 122 236 114 248 128" stroke-width="2.2" />
    <path d="M256 205 C282 192 300 168 298 142 C296 122 276 114 264 128" stroke-width="2.2" />
  </g>

  <!-- Candi Laras (Winged Gateway at Base of Kayon) -->
  <g fill="#0B0506" stroke="#EADFCB" stroke-opacity="0.75" stroke-width="2">
