<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <rect width="120" height="120" fill="#3B0A14" />
  <!-- Four-lobed Kawung Keraton Geometry -->
  <g fill="#6B1424" fill-opacity="0.55" stroke="#EADFCB" stroke-opacity="0.24" stroke-width="1.4">
    <!-- Top-Left Kawung -->
    <path d="M30 0 C48 0 60 12 60 30 C42 30 30 18 30 0 Z" />
    <path d="M30 60 C48 60 60 48 60 30 C42 30 30 42 30 60 Z" />
    <path d="M30 60 C12 60 0 48 0 30 C18 30 30 42 30 60 Z" />
    <path d="M30 0 C12 0 0 12 0 30 C18 30 30 18 30 0 Z" />
    <!-- Top-Right Kawung -->
    <path d="M90 0 C108 0 120 12 120 30 C102 30 90 18 90 0 Z" />
    <path d="M90 60 C108 60 120 48 120 30 C102 30 90 42 90 60 Z" />
    <path d="M90 60 C72 60 60 48 60 30 C78 30 90 42 90 60 Z" />
    <path d="M90 0 C72 0 60 12 60 30 C78 30 90 18 90 0 Z" />
    <!-- Bottom-Left Kawung -->
    <path d="M30 60 C48 60 60 72 60 90 C42 90 30 78 30 60 Z" />
    <path d="M30 120 C48 120 60 108 60 90 C42 90 30 102 30 120 Z" />
    <path d="M30 120 C12 120 0 108 0 90 C18 90 30 102 30 120 Z" />
    <path d="M30 60 C12 60 0 72 0 90 C18 90 30 78 30 60 Z" />
    <!-- Bottom-Right Kawung -->
    <path d="M90 60 C108 60 120 72 120 90 C102 90 90 78 90 60 Z" />
    <path d="M90 120 C108 120 120 108 120 90 C102 90 90 102 90 120 Z" />
    <path d="M90 120 C72 120 60 108 60 90 C78 90 90 102 90 120 Z" />
    <path d="M90 60 C72 60 60 72 60 90 C78 90 90 78 90 60 Z" />
  </g>
  <!-- Isen-isen Cecek (Center Seeds) -->
  <g fill="#EADFCB" fill-opacity="0.32">
    <circle cx="45" cy="15" r="1.8" />
    <circle cx="45" cy="45" r="1.8" />
    <circle cx="15" cy="45" r="1.8" />
    <circle cx="15" cy="15" r="1.8" />
    <circle cx="105" cy="15" r="1.8" />
    <circle cx="105" cy="45" r="1.8" />
    <circle cx="75" cy="45" r="1.8" />
    <circle cx="75" cy="15" r="1.8" />
    <circle cx="45" cy="75" r="1.8" />
    <circle cx="45" cy="105" r="1.8" />
    <circle cx="15" cy="105" r="1.8" />
    <circle cx="15" cy="75" r="1.8" />
    <circle cx="105" cy="75" r="1.8" />
    <circle cx="105" cy="105" r="1.8" />
    <circle cx="75" cy="105" r="1.8" />
    <circle cx="75" cy="75" r="1.8" />
    <circle cx="60" cy="60" r="3" />
  </g>
</svg>
