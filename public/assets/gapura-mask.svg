    <circle cx="608" cy="218" r="8" />
    <circle cx="656" cy="296" r="7" />
    <circle cx="678" cy="372" r="7" />

    <!-- Side Pillar Carved Notch Cutouts -->
    <path d="M 96 480 L 114 492 L 96 504 Z" />
