    <path d="M314 316 Q350 302 382 314" stroke-width="5.5" />
    <path d="M418 314 Q450 302 486 316" stroke-width="5.5" />
    <path d="M324 342 Q354 334 378 342" stroke-width="4" />
    <path d="M422 342 Q446 334 476 342" stroke-width="4" />
    <circle cx="352" cy="342" r="5" fill="#1B0A0E" />
    <circle cx="448" cy="342" r="5" fill="#1B0A0E" />
