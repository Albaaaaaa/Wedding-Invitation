      <stop offset="0%" stop-color="#8E2233" />
      <stop offset="55%" stop-color="#3B0A14" />
      <stop offset="100%" stop-color="#0B0506" />
    </radialGradient>
    <radialGradient id="face-light-g" cx="52%" cy="38%" r="34%">
