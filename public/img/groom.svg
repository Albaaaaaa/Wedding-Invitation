  <path d="M278 315 C278 215 330 180 400 180 C470 180 522 215 522 315 C522 415 468 498 400 504 C332 498 278 415 278 315 Z" fill="url(#face-light-g)" />

  <!-- Traditional Blangkon Kasunanan / Ngayogyakarta Headdress -->
